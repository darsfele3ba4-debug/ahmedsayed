<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أ. أحمد سيد - العلوم والفيزياء</title>
    <link rel="stylesheet" href="assets/tailwind.css">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/common.js"></script>
</head>
<body class="text-gray-800 min-h-screen pb-24 relative">

    <header class="fixed top-0 w-full bg-white/95 backdrop-blur-md shadow-sm z-40 h-20 flex items-center px-4 md:px-8 border-b border-blue-100">
        <div class="flex items-center gap-3"><img class="logo-img" src="img/logo-sm.jpg" alt="أ. أحمد سيد"><h1 class="font-extrabold text-blue-900 text-lg md:text-2xl brand-name">أ. أحمد سيد<small dir="ltr">Mr. Ahmed Sayed</small></h1></div>
    </header>
    <div class="fixed top-20 w-full z-40 brand-strip"></div>

    <div class="max-w-4xl mx-auto p-4 relative pt-28">
        <div class="space-y-6">
            <div class="glass-panel rounded-2xl p-6 shadow-lg relative overflow-hidden flex flex-col md:flex-row items-center gap-6 mt-4">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-yellow-200 rounded-full opacity-60 blur-xl"></div>
                <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-200 rounded-full opacity-60 blur-xl"></div>
                <img class="hero-logo z-10" src="img/logo.jpg" alt="أ. أحمد سيد">
                <div class="w-full text-center z-10 flex flex-col justify-center">
                    <h2 class="text-2xl md:text-3xl font-bold text-gray-700 mb-2">ألعاب تفاعلية</h2>
                    <p class="text-gray-500 font-bold">العلوم - العلوم المتكاملة - الفيزياء</p>
                    <div class="mt-4 border-t border-blue-100 pt-4">
                        <p class="text-sm text-gray-500 font-bold">مع الأستاذ</p>
                        <p class="text-3xl font-extrabold text-blue-900">أحمد سيد</p>
                        <p class="text-lg font-extrabold text-yellow-600" dir="ltr">Mr. Ahmed Sayed</p>
                        <a class="phone-pill" href="https://wa.me/201145077102" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> <span dir="ltr">0114 507 7102</span></a>
                    </div>
                </div>
            </div>

            <h3 class="text-center font-bold text-gray-600 mt-8 mb-2 text-lg">اختر الدرس لتبدأ التحدى ، أو انسخ رابطه لإرساله للطلاب</h3>

            <div id="lessons"></div>

            <div class="glass-panel rounded-2xl p-5 text-center mt-8">
                <p class="font-bold text-gray-600" id="summary"></p>
                <p class="mt-3 text-yellow-600 font-extrabold">مع أ. أحمد سيد .. العلوم أسهل</p>
            </div>
        </div>
    </div>

    <div id="toast" class="copy-toast"></div>
    <script>
        // رابط الموقع بعد الرفع على GitHub Pages
        const SITE_URL = 'https://darsfele3ba4-debug.github.io/ahmedsayed/';
        function lessonUrl(id) {
            const base = /^https?:$/.test(location.protocol) ? location.href.replace(/[^\/]*([?#].*)?$/, '') : SITE_URL;
            return base + 'game.html?l=' + id;
        }
        function copyText(t) {
            if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
            return new Promise((res, rej) => {
                const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy') ? res() : rej(); } catch (e) { rej(e); } finally { ta.remove(); }
            });
        }
        function showToast(msg, ok) {
            const t = document.getElementById('toast'); t.innerHTML = msg;
            t.className = 'copy-toast show ' + (ok ? 'ok' : 'no');
            clearTimeout(t._h); t._h = setTimeout(() => t.className = 'copy-toast', 2200);
        }
        function copyLesson(ev, id, btn) {
            ev.preventDefault(); ev.stopPropagation();
            const url = lessonUrl(id);
            copyText(url).then(() => {
                showToast('<i class="fa-solid fa-circle-check"></i> تم نسخ رابط ' + LESSONS[id].title, true);
                btn.innerHTML = '<i class="fa-solid fa-check"></i> تم النسخ'; btn.classList.add('done');
                setTimeout(() => { btn.innerHTML = '<i class="fa-solid fa-copy"></i> نسخ الرابط'; btn.classList.remove('done'); }, 2000);
            }).catch(() => { prompt('انسخ الرابط:', url); });
        }

        const box = document.getElementById('lessons');
        const ids = Object.keys(LESSONS).sort((a, b) => (LESSONS[a].sort || +a) - (LESSONS[b].sort || +b));
        const grades = [...new Set(ids.map(id => LESSONS[id].grade))];
        grades.forEach(g => {
            const cards = ids.filter(id => LESSONS[id].grade === g).map(id => {
                const L = LESSONS[id];
                return `
                <div class="lesson-wrap">
                    <a href="game.html?l=${id}" class="btn-bounce bg-gradient-to-l ${L.color} text-white p-6 pb-16 rounded-2xl shadow-lg flex items-center justify-between gap-3 min-h-[150px] hover:shadow-2xl">
                        <div class="text-right">
                            <p class="text-xs font-bold text-white/80 mb-1">${L.order}</p>
                            <h4 class="font-extrabold text-xl mb-1">${L.title}</h4>
                            <p class="text-sm text-white/90"><i class="fa-solid fa-gamepad"></i> ${L.games.length} ألعاب - ${L.games.length * 15} سؤالًا</p>
                        </div>
                        <span class="icon-text">${L.iconText}</span>
                    </a>
                    <button class="copy-btn" onclick="copyLesson(event, '${id}', this)" title="${lessonUrl(id)}"><i class="fa-solid fa-copy"></i> نسخ الرابط</button>
                </div>`;
            }).join('');
            box.insertAdjacentHTML('beforeend', `<h3 class="grade-head">${g}</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-5">${cards}</div>`);
        });
        document.getElementById('summary').innerText = ids.length + ' دروس × 6 ألعاب تفاعلية × 15 سؤالًا - صح أم خطأ وتسجيل الأهداف بوقت 30 ثانية للسؤال - وإرسال النتيجة للمستر على واتساب';
    </script>
</body>
</html>
